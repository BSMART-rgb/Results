<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABACUS RESULT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #6a11cb,
        #2575fc,
        #00c6ff
    );

    padding: 20px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: auto;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
    margin: 10px 0 20px;

    text-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

.box {
    width: 100%;

    background: rgba(255,255,255,0.96);

    padding: 20px;

    border-radius: 22px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
}

label {
    display: block;

    font-size: 15px;
    font-weight: bold;

    margin-top: 10px;
    margin-bottom: 7px;

    color: #333;
}

input {
    width: 100%;

    padding: 13px;

    border: 2px solid #ddd;
    border-radius: 10px;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #2575fc;
}

button {
    width: 100%;

    margin-top: 18px;

    padding: 14px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #6a11cb,
        #2575fc
    );

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.2);
}

button:active {
    transform: scale(0.98);
}

.error {
    display: none;

    margin-top: 18px;

    padding: 13px;

    text-align: center;

    background: #ffe5e5;
    color: #d00000;

    border-radius: 10px;

    font-weight: bold;
}

/* RESULT BOX */

.result {
    display: none;

    width: 100%;

    margin-top: 20px;

    padding: 18px;

    border-radius: 20px;

    background: linear-gradient(
        135deg,
        #ffffff,
        #eef7ff
    );

    box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

    animation: resultIn 0.7s ease;

    overflow: hidden;
}

@keyframes resultIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* CONGRATULATIONS */

.celebrateText {

    display: none;

    width: 100%;

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    color: #ff1493;

    margin-bottom: 15px;

    padding: 5px;

    line-height: 1.25;

    overflow-wrap: break-word;
}

/* STUDENT NAME */

.studentName {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #6a11cb;

    margin-bottom: 15px;

    overflow-wrap: anywhere;
}

/* INFORMATION */

.info {

    background: white;

    padding: 11px;

    margin: 8px 0;

    border-radius: 10px;

    box-shadow:
        0 2px 7px rgba(0,0,0,0.08);

    font-size: 15px;

    overflow-wrap: anywhere;
}

.info b {
    color: #333;
}

/* RANK */

.rank {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin: 16px 0;

    color: #ff9800;
}

/* SELECTED */

.selected {

    width: 100%;

    text-align: center;

    padding: 13px;

    border-radius: 12px;

    background: #d4ffd4;

    color: #008000;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.5;

    overflow-wrap: break-word;
}

/* NOT SELECTED */

.not-selected {

    width: 100%;

    text-align: center;

    padding: 13px;

    border-radius: 12px;

    background: #ffe0e0;

    color: #d00000;

    font-size: 15px;

    font-weight: bold;
}

/* FLOWER CELEBRATION */

.celebration {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    display: none;

    z-index: 999;
}

.flower {

    position: absolute;

    top: -50px;

    animation-name: fall;

    animation-timing-function: linear;

    animation-iteration-count: 1;
}

@keyframes fall {

    0% {
        transform:
            translateY(-50px)
            rotate(0deg);
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg);
        opacity: 0;
    }

}

/* MOBILE */

@media (max-width: 380px) {

    body {
        padding: 10px;
    }

    .title {
        font-size: 25px;
    }

    .box {
        padding: 15px;
    }

    .result {
        padding: 15px;
    }

    .celebrateText {
        font-size: 21px;
    }

    .studentName {
        font-size: 21px;
    }

    .info {
        font-size: 14px;
    }

    .rank {
        font-size: 20px;
    }

}

</style>
</head>


<body>

<!-- FLOWER CELEBRATION -->

<div
    class="celebration"
    id="celebration">
</div>


<div class="container">

    <div class="title">
        🏆 ABACUS RESULT 🏆
    </div>


    <div class="box">

        <label>
            Register Number
        </label>

        <input
            type="text"
            id="regNo"
            placeholder="Enter Register Number"
        >


        <label>
            Date of Birth
        </label>

        <input
            type="date"
            id="dob"
        >


        <button onclick="checkResult()">

            ✨ CHECK RESULT ✨

        </button>


        <!-- ERROR -->

        <div
            class="error"
            id="error">

            Result not found.
            Please check your details.

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="result">


            <!-- CONGRATULATIONS FOR EVERYONE -->

            <div
                class="celebrateText"
                id="celebrateText">

                🎉 CONGRATULATIONS! 🎉

            </div>


            <!-- NAME -->

            <div
                class="studentName"
                id="studentName">
            </div>


            <!-- CLASS -->

            <div class="info">

                <b>Class:</b>

                <span id="studentClass">
                </span>

            </div>


            <!-- SCHOOL -->

            <div class="info">

                <b>School:</b>

                <span id="studentSchool">
                </span>

            </div>


            <!-- LEVEL -->

            <div class="info">

                <b>Level:</b>

                <span id="studentLevel">
                </span>

            </div>


            <!-- RANK -->

            <div class="rank">

                🏅 Rank:

                <span id="studentRank">
                </span>

            </div>


            <!-- SELECTION -->

            <div id="selection">
            </div>


        </div>

    </div>

</div>


<script>

/* STUDENT DATA */

const students = [

    {
        regNo: "1001",
        dob: "2016-06-28",
        name: "Advith Arun",
        className: "5",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 1
    },

    {
        regNo: "1002",
        dob: "2014-11-01",
        name: "Adrith Arun",
        className: "6",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 1
    },

    {
        regNo: "1003",
        dob: "2016-04-01",
        name: "Sai Swaroop",
        className: "4",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 1
    },

    {
        regNo: "1004",
        dob: "2016-01-03",
        name: "Muhammed Shaheem",
        className: "4",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 4
    },

    {
        regNo: "1005",
        dob: "2015-11-12",
        name: "Shifin",
        className: "4",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 2
    },

    {
        regNo: "1006",
        dob: "2014-10-12",
        name: "Muhammed Imad",
        className: "6",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 2
    },

    {
        regNo: "1007",
        dob: "2016-07-11",
        name: "Rijul",
        className: "4",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 2
    },

    {
        regNo: "1008",
        dob: "2014-05-22",
        name: "Abhinanth",
        className: "6",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 4
    },

    {
        regNo: "1009",
        dob: "2016-03-18",
        name: "Adhil Muhammed",
        className: "4",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 1
    },

    {
        regNo: "1010",
        dob: "2015-11-10",
        name: "Eshan",
        className: "6",
        school: "NSS Alanallur",
        level: "B Level",
        rank: 5
    }

];


/* CHECK RESULT */

function checkResult() {

    const regNo =
        document
        .getElementById("regNo")
        .value
        .trim();

    const dob =
        document
        .getElementById("dob")
        .value;


    const student =
        students.find(
            s =>
            s.regNo === regNo &&
            s.dob === dob
        );


    const resultBox =
        document.getElementById("result");

    const errorBox =
        document.getElementById("error");

    const celebrateText =
        document.getElementById("celebrateText");


    /* RESULT NOT FOUND */

    if (!student) {

        resultBox.style.display = "none";

        errorBox.style.display = "block";

        celebrateText.style.display = "none";

        return;
    }


    /* RESULT FOUND */

    errorBox.style.display = "none";

    resultBox.style.display = "block";


    /* STUDENT DETAILS */

    document
        .getElementById("studentName")
        .textContent = student.name;


    document
        .getElementById("studentClass")
        .textContent = student.className;


    document
        .getElementById("studentSchool")
        .textContent = student.school;


    document
        .getElementById("studentLevel")
        .textContent = student.level;


    document
        .getElementById("studentRank")
        .textContent = student.rank;


    /* CONGRATULATIONS FOR EVERY STUDENT */

    celebrateText.style.display = "block";


    /* SELECTION */

    if (student.rank <= 5) {

        document
        .getElementById("selection")
        .innerHTML = `

            <div class="selected">

                ✓ SELECTED

                <br>

                ELIGIBLE FOR DISTRICT LEVEL

            </div>

        `;

    }

    else {

        document
        .getElementById("selection")
        .innerHTML = `

            <div class="not-selected">

                NOT ELIGIBLE FOR DISTRICT LEVEL

            </div>

        `;

    }


    /* FLOWERS ONLY FOR RANK 1 */

    if (student.rank === 1) {

        startCelebration();

    }

}


/* FLOWER ANIMATION */

function startCelebration() {

    const celebration =
        document.getElementById(
            "celebration"
        );


    celebration.innerHTML = "";

    celebration.style.display = "block";


    const flowers = [

        "🌸",
        "🌺",
        "🌼",
        "💐",
        "🎉",
        "✨",
        "🌷"

    ];


    for (
        let i = 0;
        i < 60;
        i++
    ) {

        const flower =
            document.createElement("div");


        flower.className = "flower";


        flower.innerText =
            flowers[
                Math.floor(
                    Math.random()
                    * flowers.length
                )
            ];


        flower.style.left =
            Math.random() * 100 + "%";


        flower.style.animationDuration =
            (2 + Math.random() * 3) + "s";


        flower.style.animationDelay =
            Math.random() * 1.5 + "s";


        flower.style.fontSize =
            (20 + Math.random() * 25) + "px";


        celebration.appendChild(
            flower
        );

    }


    setTimeout(
        () => {

            celebration.style.display =
                "none";

        },
        6000
    );

}

</script>

</body>
</html>
